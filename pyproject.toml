[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guarden = ["templates/*"]

[project]
name = "guarden"
version = "1.0.0"
description = "One VPS, a handful of projects, one edge."
requires-python = ">=3.11"

dependencies = []

[project.scripts]
soil = "guarden.soil:main"
weedr = "guarden.weedr:main"
loom = "guarden.loom:main"
roots = "guarden.roots:main"
twig = "guarden.twig:main"
furrow = "guarden.furrow:main"
hose = "guarden.hose:main"
stakes = "guarden.stakes:main"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
