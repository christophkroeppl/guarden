networks:
  backends:
    external: true

services:
  dockge:
    container_name: dockge
    image: louislam/dockge:1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backends
    volumes:
      - ./data:/app/data
      - /home/docker/srv:/home/docker/srv
    environment:
      - TZ=${TZ}
      - DOCKGE_STACKS_DIR=/home/docker/srv
      - DOCKER_HOST=tcp://socket-proxy:2375
    labels:
      - diun.enable=true

      - homepage.group=Infrastructure
      - homepage.name=Dockge
      - homepage.icon=dockge.png
      - homepage.href=https://srv.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}/${DOCKGE_SLUG}
      - homepage.description=Docker compose stack manager

      - traefik.enable=true
      - traefik.docker.network=backends
      - traefik.http.services.dockge.loadbalancer.server.port=5001

      - traefik.http.middlewares.redirect-https.redirectScheme.permanent=true
      - traefik.http.middlewares.redirect-https.redirectScheme.scheme=https

      - traefik.http.routers.dockge.entrypoints=web
      - traefik.http.routers.dockge.middlewares=redirect-https
      - traefik.http.routers.dockge.rule=Host(`srv.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`) && PathPrefix(`/${DOCKGE_SLUG}`)

      - traefik.http.routers.dockge-secure.entrypoints=websecure
      - traefik.http.routers.dockge-secure.rule=Host(`srv.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`) && PathPrefix(`/${DOCKGE_SLUG}`)
      - traefik.http.routers.dockge-secure.service=dockge
      - traefik.http.routers.dockge-secure.middlewares=dockge-stripprefix
      - traefik.http.routers.dockge-secure.tls=true
      - traefik.http.routers.dockge-secure.tls.certResolver=namecheap

      - traefik.http.middlewares.dockge-stripprefix.stripprefix.prefixes=/${DOCKGE_SLUG}
