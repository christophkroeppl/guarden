networks:
  web:
    external: true

services:
  compose:
    image: louislam/dockge:1
    container_name: compose
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Stacks Directory
      # ⚠️ Left Stacks Path === Right Stacks Path (MUST)
      - /home/docker/srv:/home/docker/srv
    environment:
      # Tell Dockge where to find the stacks
      - DOCKGE_STACKS_DIR=/home/docker/srv
    labels:
      - traefik.enable=true
      - traefik.docker.network=web

      - traefik.http.routers.compose.entrypoints=http
      - traefik.http.routers.compose.rule=Host(`${ORCHESTRATOR_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)
      - traefik.http.routers.compose.middlewares=compose-https-redirect
      - traefik.http.middlewares.compose-https-redirect.redirectscheme.scheme=https
      
      - traefik.http.routers.compose-secure.entrypoints=https
      - traefik.http.routers.compose-secure.rule=Host(`${ORCHESTRATOR_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)
      - traefik.http.routers.compose-secure.tls=true
      - traefik.http.routers.compose-secure.tls.certresolver=namecheap
      - traefik.http.routers.compose-secure.service=compose

      - traefik.http.services.compose.loadbalancer.server.port=5001
      - traefik.http.middlewares.test-auth.basicauth.users=${TEST_USER}:${TEST_PASSWORD}
      - traefik.http.routers.compose.middlewares=test-auth
