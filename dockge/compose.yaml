networks:
  web:
    external: true

services:
  compose:
    image: louislam/dockge:1
    restart: unless-stopped
    networks:
      - web
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Stacks Directory
      # ⚠️ Left Stacks Path === Right Stacks Path (MUST)
      - /home/docker/srv:/home/docker/srv
    environment:
      # Tell Dockge where to find the stacks
      - DOCKGE_STACKS_DIR=/home/docker/srv
    labels:
      - traefik.enable=true
      - traefik.docker.network=web

      - traefik.http.routers.${ORCHESTRATOR_SUBDOMAIN}.entrypoints=http
      - traefik.http.routers.${ORCHESTRATOR_SUBDOMAIN}.rule=Host(`${ORCHESTRATOR_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)
      - traefik.http.middlewares.${ORCHESTRATOR_SUBDOMAIN}-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.${ORCHESTRATOR_SUBDOMAIN}.middlewares=compose-https-redirect
      - traefik.http.routers.${ORCHESTRATOR_SUBDOMAIN}-secure.entrypoints=https
      - traefik.http.routers.${ORCHESTRATOR_SUBDOMAIN}-secure.rule=Host(`${ORCHESTRATOR_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)
      - traefik.http.routers.${ORCHESTRATOR_SUBDOMAIN}-secure.tls=true
      - traefik.http.routers.${ORCHESTRATOR_SUBDOMAIN}-secure.tls.certresolver=namecheap
      - traefik.http.routers.${ORCHESTRATOR_SUBDOMAIN}-secure.service=${ORCHESTRATOR_SUBDOMAIN}

      - traefik.http.services.${ORCHESTRATOR_SUBDOMAIN}.loadbalancer.server.port=5001
      - traefik.http.middlewares.test-auth.basicauth.users=${TEST_USER}:${TEST_PASSWORD}
      - traefik.http.routers.compose.middlewares=test-auth
