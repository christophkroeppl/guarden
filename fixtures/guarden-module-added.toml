# The measured environment table with a module appended to `[modules] enabled`,
# as `weedr module add authelia` leaves it.
#
# It exists as a fixture rather than as an edit inside a test because the claim
# it serves is about what happens *after* that append: the next `soil install
# --apply` must narrow the list back to nothing, which is the failure two
# writers sharing one key cause. Staging the file states the situation; an
# in-test rewrite would make the claim depend on a text substitution working.
[host]
domain = "example.com"
interface = ""
admin_user = "operator"

[ingress]
alias = "192.0.2.1"
publication_range = [20000, 32767]

[network]
backend = "pasta"
pasta_options = [ "--map-gw" ]

[build]
lanes = 1

[modules]
enabled = ["traefik", "homepage", "authelia"]

[[environments]]
name = "production"
host_prefix = ""
gated = true
weight = 1000
free_limit = 0.10
keep_last = 7
kind = "slot"
fork_from = ""

[[environments]]
name = "staging"
host_prefix = "staging."
gated = false
weight = 100
free_limit = "0.20"
keep_last = 0
kind = "slot"
fork_from = "production"

[[environments]]
name = "preview"
host_prefix = "preview."
gated = false
weight = 10
free_limit = "0.20"
keep_last = 0
kind = "instance"
fork_from = "staging"
cap = 3