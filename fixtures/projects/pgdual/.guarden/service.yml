# A provider of two kinds on ONE port, so a consumer can hold two edges to it
# on the same port under different `as:` prefixes. The old two-part key
# `provider:port` would collide those two edges into one registry entry,
# silently dropping the first. The three-part key `provider:port:as` keeps them
# separate, so each gets its own publication and credential.
project: pgdual
units: .guarden/quadlet/
provides:
  - db
  - secret
# A `db` provider declares a volume (spec 4): without one the data lives in
# podman's anonymous volume, which the collector removes on the next
# re-ingest (ticket 326). Declared here and mounted by the container below.
state:
  - pgdata
# The landing area the snapshot-clone chain writes a dump into and reads it
# back from (ticket 327, ADR-0024). A bulk volume is never snapshotted, so a
# dump in it enters no snapshot and no fork.
bulk:
  - bulk
ports:
  - container: db
    port: 5432
# The scrub rule, and it lives HERE because it is the project's own policy
# (ADR-0024): what this database's rows look like when they are cloned is a fact
# about the project, so it is versioned with the deployment and reviewable in a
# pull request. It removes the outgoing mail configuration — the operator's own
# rule — and keeps the message history, which is a different thing.
scrub:
  tables:
    - name: ir_mail_server
  keys:
    - table: ir_config_parameter
      column: key
      prefix: "mail."
