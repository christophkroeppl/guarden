# The shipped environment table (spec 3.1). It is a fixture rather than a
# constant in a program, and this file existing is the evidence: appending a
# `preprod` block is a configuration change and needs no code change.
[host]
domain = "example.com"
interface = ""
admin_user = "operator"

[ingress]
alias = ""
publication_range = [20000, 32767]

[network]
backend = "pasta"
pasta_options = [ "--map-gw", "--ipv4-only", "-a", "10.0.2.100", "-n", "24", "-g", "10.0.2.2" ]

[build]
lanes = 1

[modules]
enabled = ["gate-traefik", "homepage"]

[[environments]]
name = "production"
host_prefix = ""
gated = true
weight = 1000
free_limit = 0.10
keep_last = 7
kind = "slot"
fork_from = ""

[[environments]]
name = "staging"
host_prefix = "staging."
gated = false
weight = 100
free_limit = 0.20
keep_last = 0
kind = "slot"
fork_from = "production"

[[environments]]
name = "preview"
host_prefix = "preview."
gated = false
weight = 10
free_limit = 0.20
keep_last = 0
kind = "instance"
fork_from = "staging"
cap = 3

[[environments]]
name = "preprod"
host_prefix = "preprod."
gated = false
weight = 500
free_limit = 0.10
keep_last = 0
kind = "slot"
fork_from = "production"
