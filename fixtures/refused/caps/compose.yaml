# The refusal list, in the vocabulary a Compose file is written in. `cap_add` is
# what stops this one: the `network_mode` and the `PublishPort` would be replaced
# and stripped, and the render would not go ahead either.
#
# This project is under fixtures/refused/ rather than fixtures/projects/ because
# it is not renderable, and the test that walks every rendered unit of every
# fixture project has to be able to say "every one of them renders".
services:
  web:
    image: docker.io/library/nginx:1.27
    network_mode: host
    cap_add:
      - SYS_ADMIN
    ports:
      - "8080:80"
    volumes:
      - data:/var/lib/nginx
