# The shipped environment table (spec 3.1). It is a fixture rather than a
# constant in a program, and this file existing is the evidence: appending a
# `preprod` block is a configuration change and needs no code change.
#
# Two things differ from the shipped table, and each earns its place.
# `[modules] enabled` is **empty**, which is what makes the merge claim
# non-vacuous: every other shipped fixture already carries `["gate-traefik",
# "homepage"]`, so a suite that started from one of those could not tell "the
# installer's selection was merged" from "the file already said this" — the
# first assertion would be satisfied before the apply ran. And `ingress.alias`
# holds the derived value the pinned set names: `soil install` writes it from
# the `-g` in `[network] pasta_options` (ADR-0018), so a suite that borrowed
# the alias item as its guaranteed non-zero exit would be asserting a state a
# converged host does not have. The address below is the pinned one: nothing
# measures it and nothing dials it here.
[host]
domain = "example.com"
interface = ""
admin_user = "operator"

[ingress]
alias = "10.0.2.2"
publication_range = [20000, 32767]

[network]
backend = "pasta"
pasta_options = [ "--map-gw", "--ipv4-only", "-a", "10.0.2.100", "-n", "24", "-g", "10.0.2.2" ]

[build]
lanes = 1

[modules]
enabled = []

# Every track here pins `expose = "edge"` on purpose: these suites exercise
# the public (edge) posture explicitly, because the shipped default is the
# derived one (ticket 293) — loopback-only until cloudflared is installed.
# A suite testing the derived default removes the rows.
[[environments]]
name = "production"
expose = "edge"
host_prefix = ""
gated = true
weight = 1000
free_limit = 0.10
keep_last = 7
kind = "slot"
fork_from = ""

[[environments]]
name = "staging"
expose = "edge"
host_prefix = "staging."
gated = false
weight = 100
free_limit = 0.20
keep_last = 0
kind = "slot"
fork_from = "production"

[[environments]]
name = "preview"
expose = "edge"
host_prefix = "preview."
gated = false
weight = 10
free_limit = 0.20
keep_last = 0
kind = "instance"
fork_from = "staging"
cap = 3
