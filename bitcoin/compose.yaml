networks:
  edge:
    external: true
  bitcoin-net:
    name: bitcoin-net

services:
  bitcoin-knots:
    image: bitcoinknots/bitcoin:29.3.knots20260210-bip110-v0.3-alpine
    container_name: bitcoind
    user: "${USER_ID:-100}:${GROUP_ID:-101}"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      # https://hub.docker.com/r/bitcoinknots/bitcoin#using-a-custom-user-id-uid-and-group-id-gid
      - UID=${USER_ID:-100}
      - GID=${GROUP_ID:-101}
    networks:
      - edge
      - bitcoin-net
    volumes:
      - ./data:/home/bitcoin/.bitcoin
    ports:
      - 8333:8333 # Mainnet P2P
      # - 8332:8332 # Mainnet RPC
    command:
      - -printtoconsole=1
      - -server=1
      # - -rpcbind=0.0.0.0
      # - -rpcallowip=172.100.0.0/16 # as per edge network
      # - -rpcauth=${RPC_AUTH}
      - -prune=${BLOCK_PRUNE_SIZE:-99999}
    labels:
      - diun.enable=true
      - diun.include_tags=.*bip110.*alpine.*
