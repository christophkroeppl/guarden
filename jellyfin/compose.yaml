# Jellyfin: Media server

networks:
  backends:
    external: true

services:
  jellyfin:
    container_name: jellyfin
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/config:/config
      - ./data/cache:/cache
      - ./data/data:/data
    networks:
      - backends
    labels:
      - diun.enable=true

      - homepage.group=Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href=https://${JELLYFIN_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}
      - homepage.description=Media server
      - homepage.widget.type=jellyfin
      - homepage.widget.url=http://jellyfin:8096
      - homepage.widget.key=${JELLYFIN_API_KEY}

      - traefik.enable=true
      - traefik.docker.network=backends
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096

      - traefik.http.middlewares.redirect-https.redirectScheme.permanent=true
      - traefik.http.middlewares.redirect-https.redirectScheme.scheme=https

      - traefik.http.routers.jellyfin.entrypoints=web
      - traefik.http.routers.jellyfin.middlewares=redirect-https
      - traefik.http.routers.jellyfin.rule=Host(`${JELLYFIN_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)

      - traefik.http.routers.jellyfin-secure.entrypoints=websecure
      - traefik.http.routers.jellyfin-secure.rule=Host(`${JELLYFIN_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)
      - traefik.http.routers.jellyfin-secure.service=jellyfin
      - traefik.http.routers.jellyfin-secure.tls=true
      - traefik.http.routers.jellyfin-secure.tls.certResolver=namecheap
