networks:
  backends:
    external: true

services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=${SRV_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ./config:/app/config
      - ./data/icons:/app/public/icons
    networks:
      - backends
    labels:
      - diun.enable=true

      - traefik.enable=true
      - traefik.docker.network=backends
      - traefik.http.services.homepage.loadbalancer.server.port=3000

      - traefik.http.middlewares.redirect-https.redirectScheme.permanent=true
      - traefik.http.middlewares.redirect-https.redirectScheme.scheme=https

      - traefik.http.routers.homepage.entrypoints=web
      - traefik.http.routers.homepage.middlewares=redirect-https
      - traefik.http.routers.homepage.rule=Host(`${SRV_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)

      - traefik.http.routers.homepage-secure.entrypoints=websecure
      - traefik.http.routers.homepage-secure.rule=Host(`${SRV_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)
      - traefik.http.routers.homepage-secure.service=homepage
      - traefik.http.routers.homepage-secure.tls=true
      - traefik.http.routers.homepage-secure.tls.certResolver=namecheap
