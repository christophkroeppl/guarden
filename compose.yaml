networks:
  edge:
    name: edge
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.100.0.0/16
    driver_opts:
      com.docker.network.bridge.name: docker_edge
  backends:
    name: backends
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: docker_backends

include:
  - ./socket-proxy/compose.yaml
  - ./traefik/compose.yaml
  - ./dockge/compose.yaml
  - ./diun/compose.yaml
  - ./vaultwarden/compose.yaml
  - ./crowdsec/compose.yaml
  - ./homepage/compose.yaml
  - ./authelia/compose.yaml
  - ./jellyfin/compose.yaml
  - ./resilio/compose.yaml
  - ./jdownloader/compose.yaml
