networks:
  web:
    name: web
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.100.0.0/16
    driver_opts:
      com.docker.network.bridge.name: docker_web
  proxy-web:
    name: proxy-web
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.101.0.0/16
    driver_opts:
      com.docker.network.bridge.name: docker_proxy_web

include:
  - ./traefik/compose.yaml
