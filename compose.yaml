      - 443:443
    volumes:
      - ./config:/etc/traefik:ro
      #- /var/run/docker.sock:/var/run/docker.sock:ro
    #environment:
    #  - CF_DNS_API_TOKEN=your-cloudflare-api-token
    #networks:
    #  - root
    restart: unless-stopped