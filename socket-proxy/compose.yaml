# Docker Socket Proxy – secure proxy for Docker API
# Only this container mounts the host socket; other services use tcp://socket-proxy:2375
# Ref: https://github.com/TenovanDigital/ServerSecurityStack

networks:
  backends:
    external: true

services:
  socket-proxy:
    container_name: socket-proxy
    image: lscr.io/linuxserver/socket-proxy:latest
    restart: unless-stopped
    environment:
      # URL prefix controls: 0=revoke, 1=grant
      - EVENTS=1
      - PING=1
      - VERSION=1
      - AUTH=0
      - SECRETS=0
      - POST=1   # Dockge, stack operations
      - BUILD=1
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1  # Traefik, Diun, Dockge
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - NODES=0
      - PLUGINS=0
      - SERVICES=1
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backends
    read_only: true
    tmpfs:
      - /run
    security_opt:
      - no-new-privileges:true
    labels:
      - diun.enable=true
