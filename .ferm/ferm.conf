# Main ferm config: default policies and chain structure.
# Rule details live in ferm.d/*.ferm (included at the end).

domain (ip ip6) {
    table filter {
        # Default: drop incoming, allow outgoing
        chain INPUT policy DROP;
        chain OUTPUT policy ACCEPT;

        # Loopback always allowed
        chain INPUT interface lo ACCEPT;
        chain OUTPUT outerface lo ACCEPT;

        chain INPUT {
            # SSH and ICMP allowed (refined in ferm.d/10-in.ssh.ferm with fail2ban)
            proto tcp dport ssh ACCEPT;
            proto icmp ACCEPT;
        }

        # Established/related connections allowed in both directions
        chain (INPUT OUTPUT) {
            mod conntrack ctstate (RELATED ESTABLISHED) ACCEPT;
        }
    }
}

# Project-specific rules (Docker, SSH+fail2ban, public ports)
@include ferm.d/;
