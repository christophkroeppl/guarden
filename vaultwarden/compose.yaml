networks:
  backends:
    external: true

services:
  vaultwarden:
    image: vaultwarden/server:latest-alpine
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=true
      - INVITATIONS_ALLOWED=true
      - LOGIN_RATELIMIT_MAX_BURST=10
      - LOGIN_RATELIMIT_SECONDS=60
      - ADMIN_RATELIMIT_MAX_BURST=10
      - ADMIN_RATELIMIT_SECONDS=60
      - ADMIN_TOKEN={VAULTWARDEN_ADMIN_TOKEN}
      #- SENDS_ALLOWED=true
      #- EMERGENCY_ACCESS_ALLOWED=true
      #- SMTP_HOST={VAULTWARDEN_SMTP_HOST}
      #- SMTP_FROM={VAULTWARDEN_SMTP_FROM}
      #- SMTP_FROM_NAME={VAULTWARDEN_SMTP_FROM_NAME}
      #- SMTP_SECURITY={VAULTWARDEN_SMTP_SECURITY}
      #- SMTP_PORT={VAULTWARDEN_SMTP_PORT}
      #- SMTP_USERNAME={VAULTWARDEN_SMTP_USERNAME}
      #- SMTP_PASSWORD={VAULTWARDEN_SMTP_PASSWORD}
      #- SMTP_AUTH_MECHANISM={VAULTWARDEN_SMTP_AUTH_MECHANISM}
      - WEB_VAULT_ENABLED=true
      - DOMAIN=https://${VAULTWARDEN_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}
    volumes:
      - ./data:/data
    networks:
      - backends
    labels:
      - diun.enable=true
      - diun.include_tags=alpine

      - traefik.enable=true
      - traefik.docker.network=backends
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80

      - traefik.http.middlewares.redirect-https.redirectScheme.permanent=true
      - traefik.http.middlewares.redirect-https.redirectScheme.scheme=https

      - traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)
      - traefik.http.routers.vaultwarden.entrypoints=web
      - traefik.http.routers.vaultwarden.middlewares=redirect-https

      - traefik.http.routers.vaultwarden-secure.entrypoints=websecure
      - traefik.http.routers.vaultwarden-secure.rule=Host(`${VAULTWARDEN_SUBDOMAIN}.${NAMECHEAP_DOMAIN__KROEPPL_ONLINE}`)
      - traefik.http.routers.vaultwarden-secure.service=vaultwarden
      - traefik.http.routers.vaultwarden-secure.tls=true
      - traefik.http.routers.vaultwarden-secure.tls.certResolver=namecheap

