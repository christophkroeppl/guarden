# Written by soil install. /run is tmpfs, so every guarden path in it is
# recreated at every boot and nothing depends on the directory surviving.
# The locks directory's mode is hosttool.py's MODE_DIR_LOCKS and its group is
# LOCK_GROUP -- this file is plain text, so the copies are held in step by
# hand and asserted on the host (t20-install's mode and owner pins).
d /run/guarden              0755 root root -
d /run/guarden/locks        2770 root guarden -
