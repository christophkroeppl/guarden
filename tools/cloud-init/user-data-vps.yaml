#cloud-config
#
# Cloud-init user-data for a fresh VPS: provisions the host and runs the
# guarden install script. The install script detects that packages are
# already installed and skips the packages phase, continuing with the
# remaining soil phases (storage, sysctl, firewall, install, units).
#
# Usage: pass this file as user-data when creating a VPS (e.g. via
# your cloud provider's --user-data flag, or cloud-init's nocloud source).
#
# The install script is downloaded from the guarden repo's develop branch.
# To pin a specific version, replace the URL with a tagged release or a
# specific commit SHA.
#
# After cloud-init finishes, the install script runs. If the btrfs root
# conversion requires a reboot, the script exits with code 75 and prints
# a message — reboot and re-run the script to continue.

package_update: true

packages:
  - python3
  - python3-yaml
  - python3-jinja2
  - git
  - curl
  - ca-certificates

runcmd:
  - curl -fsSL https://raw.githubusercontent.com/christophkroeppl/guarden/develop/tools/install.sh | sudo bash

final_message: "guarden install script finished (or staged a reboot)"
