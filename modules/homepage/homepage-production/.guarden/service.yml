# The dashboard, as a service: one user, one home, one unit directory.
#
# The route is how the dashboard is reached, and it is an ordinary `routes:`
# entry like any other service's — the kernel still holds 80 and 443 and still
# forwards them to the edge, and the edge dials this service's loopback
# publication on the label `homepage` with the production track's own
# `host_prefix` (empty) in front of it.
#
# No volumes and no `state:`. `twig` writes merged widget output into
# `/var/lib/guarden/shared/dashboard/`, which this unit mounts read-only, and
# that directory is regenerated by every `twig sync` — there is nothing in it
# worth a snapshot, and a state volume here would put the dashboard on the
# ladder for no reason.
project: homepage
units: .guarden/quadlet/

routes:
  - container: homepage
    port: 3000
    host: homepage
