# Diun: Docker Image Update Notifier
# https://crazymax.dev/diun/
#
# Telegram setup: add to ../.env:
#   DIUN_NOTIF_TELEGRAM_TOKEN=<bot token from BotFather>
#   DIUN_NOTIF_TELEGRAM_CHATIDS=<your chat ID, or comma-separated list>
# See diun/README.md for step-by-step Telegram setup.

networks:
  backends:
    external: true

services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    restart: unless-stopped
    environment:
      - TZ=Europe/Prague
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_FIRSTCHECKNOTIF=true
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=false
      - DIUN_PROVIDERS_DOCKER_WATCHSTOPPED=false
      # Telegram (set in .env)
      - DIUN_NOTIF_TELEGRAM_TOKEN=${DIUN_NOTIF_TELEGRAM_TOKEN}
      - DIUN_NOTIF_TELEGRAM_CHATIDS=${DIUN_NOTIF_TELEGRAM_CHATIDS}
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backends
